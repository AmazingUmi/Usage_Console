name: Publish npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never interrupt an upload or publish two versions concurrently.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
      integrity: ${{ steps.pack.outputs.integrity }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          package-manager-cache: false
      - name: Verify tag and repository
        run: pnpm release:check
      - run: pnpm install --frozen-lockfile
      - name: Build and pack exactly once
        id: pack
        run: pnpm release:pack "$RUNNER_TEMP/npm-package"
      - name: Install and run the actual tarball outside the checkout
        run: node scripts/smoke-package.mjs "$RUNNER_TEMP/npm-package/package.tgz"
      - name: Preserve the tested tarball
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-package/package.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-package
          digest-mismatch: error
      - name: Publish the verified artifact with OIDC (no project dependency install or rebuild)
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
        run: node scripts/release.mjs publish "$RUNNER_TEMP/npm-package/package.tgz"
      - name: Release summary
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          printf '### Verified npm package\n\n[usage-console@%s](https://www.npmjs.com/package/usage-console/v/%s)\n' "$RELEASE_VERSION" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
